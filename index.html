<!DOCTYPE html>
<html>
<body style="display:flex;justify-content:center;align-items:center;height:100vh;margin:0;">

<div style="text-align:center;">

<p id="msg">Ding Don! Looks like some mail has arrived!</p>

<audio id="ding">
    <source src="dingdong.mp3" type="audio/mpeg">
</audio>

<script>
window.onload = function() {
    document.getElementById("ding").play().catch(() => {
        document.getElementById("msg").innerHTML =
            "🔔 Click anywhere to hear the ding dong!<br><br>Ding Don! Looks like some mail has arrived!";
    });
};

document.addEventListener("click", function() {
    document.getElementById("ding").play();
});
</script>

</div>

</body>
</html>
